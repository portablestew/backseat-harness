[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backseat-harness"
description = "Meta-harness that drives an off-the-shelf CLI agent one small step at a time, with an adversarial operator reviewing each turn."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # Chat history access: search/fork/checkpoint of managed sessions.
    # Compaction-by-fork and operator review both depend on it, so it is core.
    # 0.2.0 first shipped the public library API (fork_chat / find_chats /
    # ChatRef.size_bytes); 0.2.1 adds the public load_chat that turn capture uses
    # for a full, untruncated transcript.
    "chat-mother-forker>=0.2.1",
    # Pid liveliness for the process registry (~/.backseat/db.sqlite): a stored
    # pid is only trustworthy alongside psutil's create_time() to catch pid
    # reuse, which is what the task-row claim and orphan sweep check against.
    "psutil>=5.9",
    # Web interface (task web-interface §3 scaffold).
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "jinja2",
    "httpx",
    "python-multipart",
    "pywinpty>=2.0; sys_platform=='win32'",
    "ptyprocess; sys_platform!='win32'",
]

[project.scripts]
backseat-harness = "backseat_harness.cli:main"

# Version lives in exactly one place: src/backseat_harness/__init__.py (__version__).
# Hatchling reads it from there for both `uv build` and PyPI publishing.
[tool.hatch.version]
path = "src/backseat_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/backseat_harness"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
