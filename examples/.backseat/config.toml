# backseat-harness workspace config. Every value is optional; code defaults fill
# anything omitted. Layers, lowest precedence first:
#
#   ~/.backseat/config.toml              user
#   .backseat/config.toml                workspace (this file)
#   .backseat/tasks/<slug>/config.toml   task, and it may override anything below
#
# Arrays are replaced wholesale, never concatenated. The harness never writes a
# config.toml at any layer.

[harness]
# Managed-agent CLI: "opencode" | "claude" | "kiro" | "commandcode". Unset, it is the
# operator's, and a model is inherited only along with it.
provider = "kiro"
# model = "anthropic/claude-opus-4"   # optional, the managed agent's model; unset, the operator's
# [models].default, when set, overrides this model (see [models] below).
# agent = "my-builder"                # optional named agent (--agent); ignored with a warning for commandcode

# Extra flags for every managed turn, on top of the auto-approve grant each
# adapter already passes (opencode --auto, claude --permission-mode auto, kiro
# --trust-all-tools, commandcode --yolo). This is for per-workspace adjustments, not for the grant
# itself: to restrict what an agent may do, write a repo-level agent definition
# and point [harness].agent at it.
extra_args = []

# Hard ceiling per managed turn. A turn should bail rather than hang.
# Default: 3600.
turn_timeout_s = 3600

# Preemptive compaction trigger, in transcript bytes as chat-mother-forker
# reports them (~250-300k tokens at 1MB). For opencode that is summed SQLite row
# bytes rather than a file size: the right scale for a threshold, not comparable
# against a file-backed CLI. Default: 1_000_000.
compact_threshold_bytes = 1000000

# Loop budgets, all scoped to one `run` call rather than to the lane's whole
# life: a resumed lane gets a fresh budget, while state.json's `iteration` keeps
# counting up for the ledger stamps and the log names. A run that exhausts them
# blocks with both counts in `reason`.
max_iterations = 30
max_wall_clock_s = 86400
max_generations = 20

# Consecutive PROBLEM verdicts that re-send the same prompt before the run is
# blocked as stuck. A recovery that keeps changing the prompt is bounded by
# max_iterations instead. 0 disables the cap.
problem_repeat_cap = 3

# Provider invocations allowed per operator verdict, counting the first, so 3 is
# one call plus two re-asks and 1 disables re-asking. It multiplies
# [operator].timeout_s, so raise that for a validation-heavy task and lower this
# to keep the worst case bounded.
operator_retry_budget = 3

# Per-step model slots. A checklist step names a key here and its turns run under
# that id. Keys are slots by virtue of existing, with no fixed vocabulary;
# `default` is the only reserved name, and is the binding for a step that names
# no slot. A pair that is not a non-empty string is dropped with a warning, never
# silently. A task layer rebinds one key and keeps the rest.
[models]
# fast = "anthropic/claude-haiku-4-5"
# default = "anthropic/claude-sonnet-4-5"

[operator]
# The operator is the same CLI as the managed agent by default, often a stronger
# model. The persona is prepended to every operator prompt, so one source of truth
# serves all providers; the harness writes no operator profile. Unset provider
# falls back to [manager], and so does a model, but only along with that provider.
# An unset agent falls back to [manager] too.
provider = "opencode"
# model = "anthropic/claude-opus-4"  # optional; unset, [manager].model
# agent = "my-operator"              # optional named agent, and the supported
#                                    # way to narrow what the operator may do.
#                                    # commandcode has no agent flag: the agent is
#                                    # ignored there, with a one-time warning.
# extra_args = []                    # optional, as above

# Exact commands the operator may run itself, e.g. a fast test run. Everything
# else it delegates to the managed agent.
verify_commands = []

# Hard ceiling for one operator call, which is a call whose whole job is to read a
# turn and emit one verdict -- deliberately not the managed turn's value.
# Default: 1800.
timeout_s = 1800
[manager]
# The generate-task manager writes a task's goal.md from a finished chat. It is the
# root of the provider and model defaults: [operator] falls back to it, and
# [harness] falls back to [operator].
provider = "claude"
# model = "opencode/mimo-v2.6-flash-free"  # optional; unset, the provider CLI's default
# agent = "my-manager"  # optional named agent; [operator] inherits it when unset

# Hard ceiling for the whole generation run, reviewer rounds included. Default: 1800.
timeout_s = 1800

# Reviews the manager may run before it stops. It also stops early when a review
# comes back clean. Default: 3.
review_rounds = 3

[web]
# Port for the web UI (default: 8090)
port = 8090