<!-- Included after a plain-text <pre> on the chat and task transcript pages (the
     transcript box) and the task page (the goal). The <pre> stays as the escaped
     plain-text fallback. Callers may pass md_selector and md_class via `with`;
     the defaults are the transcript box. -->
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
<script>
  (() => {
    // Swap the <pre> for sanitized markdown. The new box is built and
    // sanitized before it touches the DOM, so any failure (scripts blocked,
    // CDN down, parse error) leaves the escaped <pre> in place.
    const pre = document.querySelector({{ (md_selector or 'pre.transcript')|tojson }});
    if (!pre || !window.marked || !window.DOMPurify) return;
    try {
      // breaks: a single newline in a message stays a line break.
      const html = DOMPurify.sanitize(marked.parse(pre.textContent, { breaks: true }));
      const div = document.createElement('div');
      div.className = {{ (md_class or 'transcript transcript-md')|tojson }};
      div.innerHTML = html;
      pre.replaceWith(div);
    } catch (err) {
      // Keep the plain-text <pre>.
    }
  })();
</script>
