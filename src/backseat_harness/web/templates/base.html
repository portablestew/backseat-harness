<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}backseat-harness{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <style>
    /* Always-dark, modern chrome. Unconditional: Pico's data-theme="dark" on
       <html> pins the dark palette regardless of the OS, and color-scheme:dark
       locks native widgets (scrollbars, the datalist dropdown) dark too. No
       light variant and no OS-driven color-scheme media query anywhere. */
    :root {
      color-scheme: dark;
      --bg: #0f1216;
      --surface: #171b21;
      --surface-2: #1e242c;
      --surface-hover: #262d37;
      --border: #2a323c;
      --border-hover: #3a4553;
      --text: #e6edf3;
      --muted: #9aa7b4;
      --accent: #4c8dff;
      --accent-hover: #6ba1ff;
      --accent-ink: #06121f;
      --radius: 10px;
      --ring: 0 0 0 3px rgba(76, 141, 255, 0.35);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
      /* Align Pico's own component variables with the palette above; this
         stylesheet follows the CDN link, so these win over its defaults.
         Form spacing: Pico's default 0.75rem vertical padding towers over
         the page, and its input:not(...) selector out-specifies any
         contextual override -- so the compact scale is set here as the
         default for every form control (owner brief). */
      --pico-border-radius: var(--radius);
      --pico-primary: var(--accent);
      --pico-primary-hover: var(--accent-hover);
      --pico-form-element-spacing-vertical: 0.25rem;
      --pico-form-element-spacing-horizontal: 0.6rem;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    /* Threaded-chat header (goal G6): sticky row at the top of the chat page
       -- opaque background so the transcript scrolls under it; prompt excerpt
       on the left, continue/fork button on the right. */
    .chat-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--bg);
      padding: 0.5rem 0 0.65rem;
      margin: 0 0 1rem;
      border-bottom: 1px solid var(--border);
    }
    .chat-header-prompt {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    /* Top line (workspace name / task slug / chat prompt head) is modestly
       larger; a long prompt excerpt collapses to one ellipsised line so it
       cannot overflow the sticky bar. */
    .chat-header-prompt > strong {
      font-size: 1.15rem;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* The back link lives inside the sticky row so the header can pin at
       top: 0 from the first scroll pixel (rect.top equal before/after). It is
       styled blue like the back links on the other pages. */
    .chat-header-back {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .chat-header-back:hover {
      color: var(--accent-hover);
    }
    .chat-header-prompt small {
      color: var(--muted);
    }
    /* Push the Continue/Fork/Takeover control to the bottom of the header so
       it never overlaps the back link at the top of the prompt column. */
    .chat-header .chat-continue-form {
      align-self: flex-end;
      margin: 0.6rem 0 0;
      flex-shrink: 0;
    }
    /* The Continue/Fork button: compact, so it does not tower over the
       back link in the sticky row (owner brief: less tall, no overlap). */
    .chat-header .chat-continue-form button {
      width: auto;
      padding: 0.3rem 0.85rem;
      font-size: 0.85rem;
      line-height: 1.3;
    }
    /* Transcript (and other read-only text) boxes: breathing room so the text
       does not touch the walls or sit under the horizontal scrollbar. */
    .transcript {
      padding: 0.85rem 1rem;
      margin: 0.5rem 0 1rem;
      /* Pico's <pre> has no max-height, so this box grew to the full transcript
         height and captured the scroll with nothing to pan. Bound it so it
         scrolls vertically itself; overscroll-behavior stays auto so
         wheel/drag chains to the page once an edge is reached. */
      max-height: 70vh;
      overflow: auto;
      overscroll-behavior: auto;
    }

    a {
      color: var(--accent);
    }
    a:hover {
      color: var(--accent-hover);
    }

    /* Buttons */
    button,
    [role="button"],
    input[type="submit"],
    input[type="button"] {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease,
        transform 0.05s ease, box-shadow 0.15s ease;
    }
    button:hover,
    [role="button"]:hover,
    input[type="submit"]:hover,
    input[type="button"]:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }
    button:active,
    [role="button"]:active {
      transform: translateY(1px);
    }
    button[type="submit"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    button[type="submit"]:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    button:focus-visible,
    [role="button"]:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: none;
      box-shadow: var(--ring);
    }

    /* Inputs (incl. the datalist-backed path input) */
    input,
    textarea,
    select {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
    }
    input:hover,
    textarea:hover,
    select:hover {
      border-color: var(--border-hover);
    }
    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
    }
    /* Compact text edit boxes shared by the run brief and the add forms. */
    textarea {
      font-size: 0.85rem;
    }

    /* One table style for the home Workspaces list and the workspace Tasks /
       chats lists: a clean table with whole-row navigation and a hover
       highlight. A row carries ``data-href``; the delegated click handler at
       the bottom of the page navigates, while in-cell links keep their own
       behavior. */
    .data-table {
      width: 100%;
    }
    /* Only populated rows highlight. Empty listings are a single colspan cell
       flagged .empty-row, so the hover never fires on them. */
    .data-table tbody tr[data-href] {
      cursor: pointer;
    }
    .data-table tbody tr:not(.empty-row):hover {
      background: var(--surface-hover);
    }
    .data-table td {
      vertical-align: middle;
    }
    /* In-table links are quiet at rest and light up, underlined, only while
       their row is hovered. Task links (the homepage Tasks cell) are the
       exception: they light up only under the pointer itself, and while one
       is hovered the row's other links stay quiet. */
    .data-table a {
      text-decoration: none;
    }
    .data-table tbody tr:not(.empty-row):not(:has(a.task-link:hover)):hover a:not(.task-link) {
      text-decoration: underline;
      color: var(--accent-hover);
    }
    .data-table a.task-link:hover {
      text-decoration: underline;
      color: var(--accent-hover);
    }
    /* The Other-chats prompt reads beside the Updated date, so both take one
       size (0.8em == the <small> date cell). The prompt keeps its clean
       fixed-width face so truncation aligns. */
    .data-table small,
    .prompt {
      font-size: 0.8em;
    }
    .prompt {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
        "Liberation Mono", monospace;
    }

    /* Expander: a disclosure whose collapsed control is a round "+" and whose
       expanded state becomes a bounded panel with the control pinned at its
       top-left and its body content inside it (used for add-workspace and
       add-task). Collapsed the control is just the round "+"; the panel is
       sized well under the page width. */
    .expander {
      margin-top: 0.5rem;
    }
    .expander-plus {
      position: relative;
      display: inline-flex;
      place-items: center;
      align-items: center;
      justify-content: center;
      padding: 0;
      width: 1.7rem;
      height: 1.7rem;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1.15rem;
      line-height: 1;
      list-style: none;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, border-color 0.15s ease,
        color 0.15s ease, box-shadow 0.15s ease;
    }
    /* The glyph is drawn as two bars centered on the control's exact midpoint,
       so it centers geometrically rather than by font metrics, and collapses
       to a minus while the panel is open. Pico draws its own disclosure
       triangle on summary::after; these rules replace it, plus the native UA
       marker, so the control holds just the glyph. */
    .expander-plus::before,
    .expander-plus::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      /* Pico's details summary::after carries a margin-inline-start that
         shifted the vertical bar right (the old "-|" glyph); clear it and the
         float so both strokes share one centre and cross. */
      margin: 0;
      float: none;
      width: 0.7rem;
      height: 2px;
      border-radius: 1px;
      background: currentColor;
      transform: translate(-50%, -50%);
    }
    .expander-plus::after {
      width: 2px;
      height: 0.7rem;
    }
    .expander[open] .expander-plus::after {
      transform: translate(-50%, -50%) scaleY(0);
    }
    .expander-plus::-webkit-details-marker {
      display: none;
    }
    /* Expanded and hover states stay on the surface palette (a barely lighter
       panel) instead of the loud accent fill. */
    .expander-plus:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .expander[open] {
      display: inline-block;
      max-width: 100%;
      padding: 0.7rem 0.9rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .expander[open] .expander-plus {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .expander form {
      margin: 0;
      padding: 0;
      width: 26rem;
      max-width: 100%;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    #new-chat.expander form {
      width: 13rem;
    }
    /* Compact forms inside an expander (Add workspace / Add task): smaller
       input text. Vertical/horizontal padding comes from the compact
       --pico-form-element-spacing-* scale set above. */
    .expander input,
    .expander textarea {
      font-size: 0.85rem;
    }
    .expander button[type="submit"] {
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
    }

    /* Form-control metrics (owner brief: compact boxes). Two Pico rules work
       against the compact scale set above: it pins an explicit height on
       single-line inputs from its own 1.5 --pico-line-height variable --
       release it so padding and line-height size the box -- and its
       [type=submit] button group out-specifies a bare ``button`` selector --
       match that specificity to carry the compact line-height. */
    input:not([type=checkbox],[type=radio],[type=range]) {
      height: auto;
      line-height: 1.25;
    }
    textarea,
    [type=submit],
    [type=reset],
    [type=button],
    button,
    [role=button] {
      line-height: 1.25;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.1rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    /* Status colors (goal G5): complete green, in progress (continue) amber,
       blocked red; unknown statuses keep the grey default above. The color
       rides ``data-status`` off the raw status value, so badge text mapping
       (services/task.badge_for) stays untouched. Checklist step statuses reuse
       the same palette: done -> green, active -> amber (owner brief: checklist
       capsules colored by state). */
    .badge[data-status="complete"],
    .badge[data-status="done"] {
      color: #3fb950;
      border-color: rgba(63, 185, 80, 0.55);
      background: rgba(63, 185, 80, 0.12);
    }
    .badge[data-status="continue"],
    .badge[data-status="active"] {
      color: #e3b341;
      border-color: rgba(227, 179, 65, 0.55);
      background: rgba(227, 179, 65, 0.12);
    }
    .badge[data-status="blocked"] {
      color: #f85149;
      border-color: rgba(248, 81, 73, 0.55);
      background: rgba(248, 81, 73, 0.12);
    }

    /* Toasts */
    #toast:not(:empty) {
      margin: 0 0 1rem;
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    #toast:not(:empty) strong {
      color: var(--muted);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script>
    // htmx does not swap 4xx responses by default, so the add-workspace
    // validation toast (HTTP 400) never reached #toast. Let 400 responses
    // swap too, so the error message is shown to the user.
    document.addEventListener('htmx:beforeSwap', (evt) => {
      if (evt.detail.xhr && evt.detail.xhr.status === 400) {
        evt.detail.shouldSwap = true;
        evt.detail.isError = false;
      }
    });
  </script>
  <script>
    // Whole-row navigation for the shared table style: a row with data-href
    // navigates when clicked anywhere that is not already an interactive
    // element (in-cell links, buttons and form fields keep their own behavior).
    document.addEventListener('click', (evt) => {
      const row = evt.target.closest('tr[data-href]');
      if (!row) return;
      if (evt.target.closest('a, button, form, input, textarea, select')) return;
      window.location.href = row.getAttribute('data-href');
    });
  </script>
  <script>
    // Opt-in auto-refresh (goal.md:3): a page sets data-auto-refresh="<seconds>"
    // on <main> (or via the main_attrs block) to reload itself on a timer. This
    // script runs in <head>, before <main> exists, so it waits for
    // DOMContentLoaded before querying the attribute. It pauses while the user
    // is typing in a field or has a + expander open, then reschedules rather
    // than reloading mid-edit.
    document.addEventListener('DOMContentLoaded', function () {
      var root = document.querySelector('[data-auto-refresh]');
      if (!root) return;
      var seconds = parseInt(root.getAttribute('data-auto-refresh'), 10);
      if (!seconds || seconds < 1) seconds = 60;
      var schedule = function () { window.setTimeout(tick, seconds * 1000); };
      var tick = function () {
        var el = document.activeElement;
        var typing = el && /^(input|textarea|select)$/i.test(el.tagName);
        var openPanel = document.querySelector('details.expander[open]');
        if (typing || openPanel) { schedule(); return; }
        window.location.reload();
      };
      schedule();
    });
  </script>
</head>
<body>
  <main class="container"{% block main_attrs %}{% endblock %}>
    {% block nav %}{% endblock %}
    {% block content %}{% endblock %}
    <div id="toast" aria-live="polite"></div>
  </main>
</body>
</html>
