{% extends "base.html" %}
{% block title %}Workspaces - backseat-harness{% endblock %}
{% block content %}
<section>
  <h2>Workspaces</h2>
  <div id="workspace-list" hx-get="/workspaces/fragment" hx-trigger="every 60s, workspaceAdded from:body" hx-swap="outerHTML">
    {% for ws in workspaces %}
    <a class="workspace-card" href="/ws/{{ ws.id }}">
      <strong>{{ ws.name }}</strong><br><small>{{ ws.path }}</small>
    </a>
    {% else %}
    <p>No workspaces registered yet.</p>
    {% endfor %}
  </div>
  <details id="add-workspace" class="expander"
           hx-get="/workspaces/suggest" hx-trigger="toggle" hx-target="#ws-suggestions" hx-swap="innerHTML">
    <summary class="expander-plus" title="Add workspace" aria-label="Add workspace">+</summary>
    <form hx-post="/workspaces" hx-target="#toast" hx-swap="innerHTML">
      <label for="ws-path">Path</label>
      <input id="ws-path" name="path" type="text" list="ws-suggestions"
             placeholder="/home/user/code/my-project" required>
      <datalist id="ws-suggestions"></datalist>
      <button type="submit">Add</button>
    </form>
  </details>
</section>
{% endblock %}
